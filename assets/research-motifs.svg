      <path d="M106 117c9 4 19 5 30 0m-19-32 6 18m-3 20 5 1" stroke-width="1.1"/>
      <!-- Both arms fold together; the hands share one grip above the shoulder. -->
      <path d="M109 81c7 6 13 10 20 11 5 0 9-3 13-7l15-18-8-6-21 20-10-10"/>
      <path d="M136 83c5 3 9 4 13 1l13-13c3-4 2-7-1-10l-7-4-5 4m-19 23 17-16"/>
      <path d="m149 57-3-3c-2-2-5 0-4 3l3 7m9-7-5 6"/>
      <!-- Shaft wraps behind the shoulders; the interrupted segment is occluded by the body. -->
      <path d="m143 56-13 7m-29 15-44 23"/>
      <path d="m57 101-8-2c-3-1-5 1-4 4l2 5 13-1 2-4-5-2Z"/>
      <!-- Lead leg supports the body; trail knee turns inward and heel stays raised. -->
      <path d="M108 125c-4 22-7 48-10 78l11 1c6-22 11-43 15-62"/>
      <path d="M134 125l1 24c0 5-3 10-6 14l26 32-8 7-31-36c-3-4-4-8-3-12l5-18"/>
      <path d="m101 202-8 5-8 3c-3 1-4 5 0 6h27l-3-12m-24 8h27"/>
      <path d="m147 201 8-6 6 6 6 10c1 2 0 4-3 4h-6l-4-7-7-7Z"/>
      <path d="m156 202 5 7m-50-45 5-4" stroke-width="1.1"/>
      <path d="M72 220h107" stroke-width="1.1"/>
      <!-- A quiet ball-flight trace, separated from the athlete. -->
      <path d="M53 179c-14-27-15-56-8-80" stroke-dasharray="3 7" stroke-width="1.1"/>
    </symbol>
