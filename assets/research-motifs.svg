    <symbol id="ski" viewBox="0 0 240 240" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <!-- Three-quarter side view: quiet upper body, flexed ankles, parallel edged skis. -->
      <!-- Helmet, goggles and a forward-facing head. -->
      <path d="M130 61c-3-10 3-19 13-19 10 0 17 9 14 19l-5 7-18-3-4-4Z"/>
      <path d="m132 55 26 3-2 7-23-3-1-7Z"/>
      <path d="m135 65 1 8 8 4 7-4 1-5m-16 5-6 6m14-2-1 6"/>
      <!-- Far arm is slightly raised and held in front of the chest. -->
      <path d="m133 82 15 13 17-7 5 8-23 10-13-8"/>
      <path d="m165 88 5-3 6 3 1 5-7 3m4-3-24 79"/>
      <path d="m146 168 8 3" stroke-width="1.1"/>
      <!-- Jacket and near sleeve: shoulders forward of the hips, elbows soft. -->
      <path d="M130 79c-17 4-33 17-45 33-4 5-7 10-5 15l22 11 17-20 12-17 8 11c2 3 5 4 9 3l30-7-2-9-28 5-10-18c-2-4-5-6-8-7Z"/>
      <path d="m123 87 8 14m-47 20 21 10" stroke-width="1.1"/>
      <path d="m176 99 6-1 5 4-1 6-8 2-2-11m8 9-20 76"/>
      <path d="m160 179 8 2" stroke-width="1.1"/>
      <!-- Far leg: bent hip and knee, shin presses into the boot tongue. -->
      <path d="m108 131 30 12c5 2 7 6 5 11l-10 27-11-4 8-24-26-11"/>
      <!-- Near leg: one continuous hip-knee-ankle contour. -->
      <path d="M81 125c-5 7-4 11 3 15l30 17-12 35 11 4 16-40c2-5 1-9-4-12l-23-16"/>
      <path d="m119 147 6 5m-17 24 9 3" stroke-width="1.1"/>
      <!-- Boots meet the two parallel skis; toes face the direction of travel. -->
      <path d="m122 176 12 3-2 6 14 2 3 4-29 2-3-6 5-11Z"/>
      <path d="m102 190 12 4-2 5 14 2 4 4-30 2-5-7 7-10Z"/>
      <path d="m120 184 12 2m-32 13 12 2" stroke-width="1.1"/>
      <!-- Parallel carving lines, with both tips rising at the same angle. -->
      <path d="M28 190c54 9 116 4 171-12 8-2 12-6 15-12M28 194c55 9 117 4 172-12 9-3 15-7 18-13"/>
      <path d="M20 205c54 9 116 4 171-12 8-2 12-6 15-12M20 209c55 9 117 4 172-12 9-3 15-7 18-13"/>
      <path d="M19 163c15 5 28 7 42 6m-37 9 24 3" stroke-width="1.1"/>
    </symbol>
    <symbol id="golf" viewBox="0 0 240 240" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
